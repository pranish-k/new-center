<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}

  .strip img{height:32px;width:auto;object-fit:contain;filter:grayscale(1);opacity:.5;transition:all .25s}
  .strip img:hover{filter:none;opacity:1}
  .lab{text-align:center;font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#6b6b6b;margin-bottom:18px}
</style></head>
<body>
<p class="lab">Our students and mentors come from</p>
<div class="strip">
  <img src="../assets/logos/logo-microsoft.png" alt="Microsoft">
  <img src="../assets/logos/logo-ibm.png" alt="IBM">
  <img src="../assets/logos/logo-jpmorgan.png" alt="JPMorgan">
  <img src="../assets/logos/logo-goldman.png" alt="Goldman">
  <img src="../assets/logos/logo-deloitte.png" alt="Deloitte">
  <img src="../assets/logos/logo-amex.png" alt="AmEx">
  <img src="../assets/logos/logo-aws.png" alt="AWS">
  <img src="../assets/logos/logo-boeing.png" alt="Boeing">
  <img src="../assets/logos/logo-xerox.png" alt="Xerox">
</div>
</body></html>
