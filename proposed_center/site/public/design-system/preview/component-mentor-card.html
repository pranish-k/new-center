<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr;gap:14px}
  a.m{display:flex;gap:16px;padding:18px;background:#fff;border:1px solid #e2e0dc;text-decoration:none;color:inherit;transition:background .2s,border-color .2s,transform .25s;align-items:flex-start}
  a.m:hover{background:#f7f6f3;border-color:#002868;transform:translateY(-2px)}
  .mono{width:72px;height:72px;background:#002868;color:#f7f6f3;display:flex;align-items:center;justify-content:center;font-family:"Trajan Pro",Georgia,serif;font-weight:700;font-size:26px;letter-spacing:.04em;flex-shrink:0}
  .mono.b{background:#1D4F91}
  h4{font-family:Georgia,serif;font-weight:400;font-size:17px;color:#111;margin:0 0 4px;line-height:1.2}
  .role{font-size:12px;color:#111;margin:0 0 2px}
  .co{font-size:12px;color:#6b6b6b;margin:0 0 10px}
  .meta{display:flex;flex-direction:column;gap:3px;font-size:10px;color:#6b6b6b}
  .meta .dot{color:#b9975b;margin-right:5px}
</style></head>
<body>
  <a class="m">
    <div class="mono">SA</div>
    <div>
      <h4>Sherry Aaholm</h4>
      <p class="role">Chief Digital Officer</p>
      <p class="co">Cummins Inc.</p>
      <div class="meta">
        <span><span class="dot">·</span>Manufacturing</span>
        <span><span class="dot">·</span>C-Level Management</span>
        <span><span class="dot">·</span>Indianapolis, IN, United States</span>
      </div>
    </div>
  </a>
  <a class="m">
    <div class="mono b">TA</div>
    <div>
      <h4>Tej Anand</h4>
      <p class="role">Clinical Professor</p>
      <p class="co">Robert H. Smith School of Business</p>
      <div class="meta">
        <span><span class="dot">·</span>Higher Education / Analytics</span>
        <span><span class="dot">·</span>Data Management &amp; Analytics</span>
        <span><span class="dot">·</span>College Park, MD, United States</span>
      </div>
    </div>
  </a>
</body></html>
