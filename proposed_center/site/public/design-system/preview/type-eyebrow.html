<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">

<body>
  <div class="ex">
    <div class="demo">
      <span class="gold"></span>
      <p class="lab">What we offer</p>
    </div>
    <div class="spec">2px gold rule (24w) +<br>11px tracked label · 0.15em</div>
  </div>
  <div class="ex">
    <div class="demo">
      <span class="gold"></span>
      <p class="lab">Student voices</p>
      <h2 class="h2">What our graduates say</h2>
    </div>
    <div class="spec">Eyebrow + serif H2<br>standard section header</div>
  </div>
