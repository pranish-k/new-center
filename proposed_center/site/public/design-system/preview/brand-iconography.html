<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:flex;flex-direction:column;gap:14px}
  .row{display:flex;align-items:center;gap:14px}
  .lab{width:140px;font-size:11px;color:#6b6b6b;text-transform:uppercase;letter-spacing:.15em}
  .arrow{font-size:24px;color:#002868;font-weight:300}
  .em{color:#b9975b;font-size:18px}
  .ham{display:flex;flex-direction:column;gap:5px}
  .ham span{display:block;width:24px;height:1.5px;background:#111}
  .gold{height:2px;width:24px;background:#b9975b;display:inline-block}
  .spec{font-size:11px;color:#6b6b6b;margin-left:auto}
</style></head>
<body>
<div class="row"><span class="lab">Arrow (link)</span><span class="arrow">→</span><span class="spec">Unicode 2192 · nudges 3px on hover</span></div>
<div class="row"><span class="lab">Em-dash bullet</span><span class="em">—</span><span class="spec">replaces • in highlight lists</span></div>
<div class="row"><span class="lab">Hamburger</span><div class="ham"><span></span><span></span><span></span></div><span class="spec">Only inline SVG · stroke 1.5</span></div>
<div class="row"><span class="lab">Gold rule</span><span class="gold"></span><span class="spec">Iconographic anchor for eyebrows</span></div>
<div class="row"><span class="lab">No emoji</span><span style="color:#c00;font-size:14px">✕ 📍 📚 🏛</span><span class="spec">Forbidden in body</span></div>
</body></html>
