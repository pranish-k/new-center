<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:32px;background:#fff;font-family:var(--font-sans)}
  .stat{text-align:center}
  .num{font-family:Georgia,serif;font-size:48px;color:#002868;line-height:1}
  .lab{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#6b6b6b;margin-top:8px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
</style></head>
<body>
<div class="grid">
  <div class="stat"><div class="num">230+</div><div class="lab">Industry Mentors</div></div>
  <div class="stat"><div class="num">15+</div><div class="lab">Countries Represented</div></div>
  <div class="stat"><div class="num">300+</div><div class="lab">Student Projects</div></div>
  <div class="stat"><div class="num">25+</div><div class="lab">Years of Leadership</div></div>
</div>
</body></html>
