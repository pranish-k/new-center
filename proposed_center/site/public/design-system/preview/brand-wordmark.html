<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:28px 32px;background:#fff;font-family:var(--font-sans)}
  .lockup{display:flex;align-items:center;gap:48px;padding-bottom:24px;border-bottom:1px solid #e2e0dc;margin-bottom:20px}
  .mark{line-height:1.3;flex:1}
  .mark .top{font-family:"Trajan Pro",Georgia,serif;font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#6b6b6b;display:block}
  .mark .bot{font-family:"Trajan Pro",Georgia,serif;font-weight:700;font-size:18px;letter-spacing:.06em;color:#002868;text-transform:uppercase;display:block;margin-top:4px}
  .wos img{height:44px;opacity:.85}
  .dark{background:#1D4F91;padding:18px 22px;display:inline-block}
  .dark .top{color:rgba(255,255,255,.7)}
  .dark .bot{color:#fff}
  .meta{display:flex;gap:32px;font-size:11px;color:#6b6b6b}
  .meta strong{display:block;color:#111;margin-bottom:4px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
</style></head>
<body>
  <div class="lockup">
    <div class="mark">
      <span class="top">Columbia University · Teachers College</span>
      <span class="bot">Center for Technology Management</span>
    </div>
    <div class="mark dark">
      <span class="top">Columbia University · Teachers College</span>
      <span class="bot">Center for Technology Management</span>
    </div>
    <div class="wos"><img src="../assets/logos/wos-logo.png" alt="WOS"></div>
  </div>
  <div class="meta">
    <div><strong>Display</strong>Trajan Pro Bold · 18 · +0.06em</div>
    <div><strong>Eyebrow</strong>Trajan Pro Reg · 10 · +0.18em</div>
    <div><strong>Lockup</strong>2-line, navy + muted gray</div>
  </div>
</body></html>
