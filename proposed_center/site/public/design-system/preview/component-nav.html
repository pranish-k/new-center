<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;background:#fff;font-family:var(--font-sans)}
  header{height:64px;border-bottom:1px solid #e2e0dc;display:flex;align-items:center;padding:0 24px;justify-content:space-between}
  .mark{display:flex;flex-direction:column;line-height:1.25}
  .mark .top{font-family:"Trajan Pro",Georgia,serif;font-size:10px;text-transform:uppercase;letter-spacing:.18em;color:#6b6b6b}
  .mark .bot{font-family:"Trajan Pro",Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.06em;color:#002868;text-transform:uppercase;margin-top:2px}
  nav{display:flex;align-items:center;gap:32px}
  nav a{font-size:14px;color:#111;text-decoration:none;padding-bottom:2px}
  nav a.active{border-bottom:2px solid #b9975b}
  nav a:hover{color:#002868}
  nav .pill{background:#002868;color:#fff;border:1px solid #002868;padding:6px 16px;font-weight:500;transition:background .2s,color .2s}
  nav .pill:hover{background:#001a4d;border-color:#001a4d}
</style></head>
<body>
<header>
  <div class="mark">
    <span class="top">Columbia University · Teachers College</span>
    <span class="bot">Center for Technology Management</span>
  </div>
  <nav>
    <a href="#">About</a>
    <a href="#" class="active">Programs</a>
    <a href="#">Leadership</a>
    <a href="#" class="pill">Contact</a>
  </nav>
</header>
</body></html>
