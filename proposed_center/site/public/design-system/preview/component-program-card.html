<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans);display:grid;grid-template-columns:1fr 1fr;gap:20px}
  a.card{display:flex;flex-direction:column;text-decoration:none;color:inherit;background:#f7f6f3;overflow:hidden;box-shadow:0 4px 14px -10px rgba(10,22,40,.10);transition:transform .25s,box-shadow .25s}
  a.card:hover{transform:translateY(-3px);box-shadow:0 12px 32px -16px rgba(10,22,40,.25)}
  .ph{aspect-ratio:16/10;overflow:hidden;background:#1D4F91}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .body{padding:18px 22px 20px}
  .eb{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#b9975b;font-weight:600;margin:0 0 8px}
  h3{font-family:Georgia,serif;font-weight:400;font-size:19px;color:#111;line-height:1.25;margin:0 0 8px;letter-spacing:-.005em}
  p.d{font-size:13px;color:#6b6b6b;line-height:1.55;margin:0}
  .cta{font-size:12px;font-weight:600;color:#002868;margin:14px 0 0}
</style></head>
<body>
  <a class="card">
    <div class="ph"><img src="../assets/photos/session-classroom.jpg" alt=""></div>
    <div class="body">
      <p class="eb">Master's Degree</p>
      <h3>MS in Strategic Technology Leadership</h3>
      <p class="d">A 30-credit hybrid degree with residencies and mentor pairings.</p>
      <p class="cta">Learn more →</p>
    </div>
  </a>
  <a class="card">
    <div class="ph"><img src="../assets/photos/program-mentoring.jpg" alt=""></div>
    <div class="body">
      <p class="eb">Executive Program</p>
      <h3>Digital Leadership Experience</h3>
      <p class="d">A flexible 6–12 month program for executives navigating disruption.</p>
      <p class="cta">Learn more →</p>
    </div>
  </a>
</body></html>
